<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 外围节奏弧线（模拟旋转灯球的光线） -->
  <g fill="none" stroke-linecap="round">
    <!-- 左上弧 -->
    <path d="M 28 40 A 36 36 0 0 1 52 20" stroke="#05D9E8" stroke-width="3" opacity="0.7" filter="url(#glowCyan)"/>
    <!-- 右上弧 -->
    <path d="M 76 20 A 36 36 0 0 1 100 40" stroke="#FF2A6D" stroke-width="3" opacity="0.7" filter="url(#glowPink)"/>
    <!-- 左下弧 -->
    <path d="M 28 88 A 36 36 0 0 0 52 108" stroke="#FF2A6D" stroke-width="3" opacity="0.5" filter="url(#glowPink)"/>
    <!-- 右下弧 -->
    <path d="M 76 108 A 36 36 0 0 0 100 88" stroke="#05D9E8" stroke-width="3" opacity="0.5" filter="url(#glowCyan)"/>
  </g>

  <!-- 交谊舞双人剪影 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 男士（左，脉冲青） -->
    <g stroke="#05D9E8" stroke-width="4.5" filter="url(#glowCyan)">
      <circle cx="52" cy="38" r="5" fill="#05D9E8" stroke="none"/>
      <path d="M 52 43 L 52 68 L 46 74 L 52 70 L 58 74 L 52 68"/>
      <path d="M 52 50 L 64 54"/>
      <path d="M 52 74 L 46 86"/>
      <path d="M 52 74 L 56 86"/>
    </g>

    <!-- 女士（右，脉冲粉红） -->
    <g stroke="#FF2A6D" stroke-width="4.5" filter="url(#glowPink)">
      <circle cx="72" cy="34" r="4.5" fill="#FF2A6D" stroke="none"/>
      <path d="M 72 39 C 76 50 74 58 68 64"/>
      <path d="M 68 64 C 58 76 76 86 72 70"/>
      <path d="M 71 46 L 64 54"/>
      <path d="M 68 68 L 74 80"/>
    </g>
  </g>

  <!-- 中心播放按钮 -->
  <g>
    <!-- 播放按钮外圈光晕 -->
    <circle cx="64" cy="64" r="16" fill="#1A1A2E" opacity="0.0"/>
    <!-- 半透明圆底 -->
    <circle cx="64" cy="64" r="13" fill="#12121A" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- 播放三角 -->
    <path d="M 61 57 L 70 64 L 61 71 Z" fill="#FFFFFF"/>
  </g>
</svg>